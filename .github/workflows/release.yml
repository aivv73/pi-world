name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    # macOS, not ubuntu: the suite's host process is Bun (bun test), and Bun on
    # Linux cannot spawn a child with an extra stdio pipe on fd 3 — the guest's
    # protocol channel — failing with "Failed to connect ENOENT" in
    # #createStdioObject. Production is unaffected (pi runs the host under Node,
    # which handles extra fds); the broken combination is exactly the test
    # runner. Move back to ubuntu when Bun fixes extra-fd spawn on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck, lint, and test
        run: bun run check

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
