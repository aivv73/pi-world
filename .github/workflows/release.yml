name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    # Linux is the affected Bun-host runner pinned by the real lifecycle
    # contracts. The evaluator protocol uses loopback TCP rather than Bun's
    # unstable extra child-process stdio descriptors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Avoid pi tool fallback downloads from GitHub's anonymous API.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find && sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd
      - run: bun install --frozen-lockfile
      - name: Typecheck, lint, and test
        run: bun run check

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
