name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # Linux is the affected Bun-host runner pinned by the real lifecycle
    # contracts. The evaluator protocol uses loopback TCP rather than Bun's
    # unstable extra child-process stdio descriptors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version development and certification run locally so
      # CI tracks the toolchain the contracts were verified against instead of
      # drifting with "latest".
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Avoid pi tool fallback downloads from GitHub's anonymous API.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find && sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd
      - run: bun install --frozen-lockfile
      - name: Typecheck, lint, and test
        run: bun run check
